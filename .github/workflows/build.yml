name: Build Infinix Android 7.1
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y p7zip-full squashfs-tools xorriso e2fsprogs

      - name: Download ISO
        run: |
          curl -L --retry 10 --retry-delay 30 --max-time 600 -o android-x86.iso "https://github.com/a30464845-prog/infinix-android/releases/download/v1/android-x86-7.1-r5-k419.iso"
          ls -la android-x86.iso
          file android-x86.iso

      - name: Download APKs
        run: |
          curl -L --retry 5 --max-time 300 -o apks.zip "https://download1325.mediafire.com/5kib9hb42gtgxRnVBda6VbwdtSjKL2ES75Vm3D5RoUsHo1gpkAWngbkteayN_qLOGll3A4EplbvYII6svAZkjV8bQLssZnepQnEx2Us6MlAEs06ft0ASEDdT33V_v5TZ34JqjLdiZM1GHXm7fQUs-ZsOo5LSZPmIezDoYDJCLs3Vyw/dyjir167bdswnv6/apks.zip"
          mkdir -p apks
          7z x apks.zip -oapks/ -y
          ls -la apks/
          cd apks
          for f in *.apk *.xapk *.apkm; do
            [ -f "$f" ] || continue
            case "$f" in
              *xapk*|*apkm*)
                mkdir -p tmpx
                7z x "$f" -otmpx -y
                BASE=$(find tmpx -name "*.apk" ! -name "*split*" | head -1)
                if [ -n "$BASE" ]; then cp "$BASE" extracted_base.apk; fi
                rm -rf tmpx
                ;;
            esac
          done
          for f in *.apk *.xapk *.apkm; do
            [ -f "$f" ] || continue
            case "$f" in
              *vending*|*playstore*|*play.store*|*Phonesky*) mv "$f" playstore.apk ;;
              *Play_Dienste*|*play.services*|*gms*|*GmsCore*) mv "$f" gms.apk ;;
              *keymapper*|*key.mapper*) mv "$f" keymapper.apk ;;
              *Infinix*|*infinix*|*launcher*) mv "$f" infinixlauncher.apk ;;
            esac
          done
          if [ -f extracted_base.apk ]; then
            mv extracted_base.apk infinixlauncher.apk
          fi
          ls -la *.apk
          cd ..

      - name: Extract ISO
        run: |
          mkdir -p extracted
          7z x android-x86.iso -oextracted/ -y

      - name: Fix ACPI + Logo + Landscape
        run: |
          cd extracted
          sed -i "s/quiet/quiet acpi_osi=! acpi_osi='Windows 2012' acpi_sleep=s3_bios,s3_mode i915.modeset=1 i915.enable_fbc=0 i915.enable_psr=0 intel_idle.max_cstate=1 video=1024x768/g" isolinux/isolinux.cfg
          sed -i 's/MENU TITLE.*/MENU TITLE Infinix Android 7.1 - Made by ABDUL REHMAN FAROOQI/g' isolinux/isolinux.cfg
          cp ../infinix-logo.bmp isolinux/boot.splash

      - name: Modify system
        run: |
          cd extracted
          unsquashfs -d sysroot system.sfs
          cd sysroot
          ls -la
          mkdir -p /tmp/stage
          mkdir -p /tmp/stage/priv-app/GmsCore
          mkdir -p /tmp/stage/priv-app/Phonesky
          mkdir -p /tmp/stage/app/Keymapper
          mkdir -p /tmp/stage/app/InfinixLauncher
          cp ../../apks/gms.apk /tmp/stage/priv-app/GmsCore/GmsCore.apk
          cp ../../apks/playstore.apk /tmp/stage/priv-app/Phonesky/Phonesky.apk
          cp ../../apks/keymapper.apk /tmp/stage/app/Keymapper/Keymapper.apk
          cp ../../apks/infinixlauncher.apk /tmp/stage/app/InfinixLauncher/InfinixLauncher.apk
          chmod 644 /tmp/stage/priv-app/GmsCore/GmsCore.apk
          chmod 644 /tmp/stage/priv-app/Phonesky/Phonesky.apk
          chmod 644 /tmp/stage/app/Keymapper/Keymapper.apk
          chmod 644 /tmp/stage/app/InfinixLauncher/InfinixLauncher.apk
          debugfs -R "rdump /build.prop /tmp/build.prop" system.img
          sed -i 's/ro.product.name=.*/ro.product.name=Infinix Android/' /tmp/build.prop
          sed -i 's/ro.product.brand=.*/ro.product.brand=Infinix/' /tmp/build.prop
          sed -i 's/ro.product.model=.*/ro.product.model=Android 7.1 PC/' /tmp/build.prop
          sed -i 's/ro.build.display.id=.*/ro.build.display.id=INFINIX-ANDROID-7.1/' /tmp/build.prop
          sed -i 's/ro.build.fingerprint=.*/ro.build.fingerprint=infinix/android/infinix_pc/InfinixAndroid:7.1/NMF26X/170000:user/release-keys/' /tmp/build.prop
          echo 'ro.config.orientation=1' >> /tmp/build.prop
          echo 'persist.sys.rotation=1' >> /tmp/build.prop
          echo 'ro.config.activity_screen_timeout=600000' >> /tmp/build.prop
          echo 'ro.launcher.preferred=com.smartsoft.infinixlauncher' >> /tmp/build.prop
          debugfs -w -R "rm /build.prop" system.img
          debugfs -w -R "write /tmp/build.prop /build.prop" system.img
          e2cp -r /tmp/stage/priv-app system.img
          e2cp -r /tmp/stage/app system.img
          cd ..
          rm -f system.sfs
          mksquashfs sysroot system.sfs -comp xz
          rm -rf sysroot

      - name: Rebuild ISO
        run: |
          cd extracted
          xorriso -as mkisofs -o ../Infinix-Android-7.1.iso -b isolinux/isolinux.bin -c isolinux/boot.cat -no-emul-boot -boot-load-size 4 -boot-info-table -R -J -V "INFINIX ANDROID" .
          ls -la ../Infinix-Android-7.1.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: infinix-android-7.1
          path: Infinix-Android-7.1.iso   
